<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frame Industries | Spatial Hub | Meta Quest</title>
  <meta name="theme-color" content="#0a0a12">
  <meta name="color-scheme" content="dark">
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
  <style>
    body { margin: 0; background: #0a0a12; color: #e8e8f0; font-family: system-ui, sans-serif; }
    .info {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(10,10,18,0.85); padding: 12px 20px; border-radius: 12px;
      border: 1px solid rgba(101,46,166,0.4); text-align: center; max-width: 90%;
      backdrop-filter: blur(10px); z-index: 100; font-size: 14px;
    }
    .info a { color: #42D2D3; }
  </style>
</head>
<body>
  <div class="info">
    در Meta Quest Browser باز کن → دکمه <strong>Enter VR</strong> رو بزن → پنل‌ها رو بگیر و جابجا کن.<br>
    <a href="https://frame.iddns.ir" target="_blank">بازگشت به هاب دوبعدی</a>
  </div>

  <a-scene
    renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true;"
    background="color: #0a0a12"
    fog="type: exponential; color: #0a0a12; density: 0.04"
    vr-mode-ui="enabled: true"
    hand-tracking-controls="enabled: true"
    loading-screen="dotsColor: #42D2D3; backgroundColor: #0a0a12"
    shadow="type: pcfsoft">

    <!-- Ambient spatial sound -->
    <a-sound src="https://cdn.pixabay.com/audio/2022/03/15/audio_8cb749e841.mp3"
             autoplay="true" loop="true" volume="0.25"
             position="0 1.5 -2"></a-sound>

    <!-- Interaction sound (short soft click) -->
    <a-sound id="sfx-click" src="https://cdn.pixabay.com/audio/2021/08/09/audio_12b0c7443c.mp3"
             volume="0.4"></a-sound>

    <!-- Lighting -->
    <a-entity light="type: ambient; color: #1a1228; intensity: 0.4"></a-entity>
    <a-entity light="type: directional; color: #7c4dff; intensity: 0.7; castShadow: true" position="-3 6 2"></a-entity>
    <a-entity light="type: point; color: #42D2D3; intensity: 0.6; distance: 12" position="1.5 2.5 1"></a-entity>
    <a-entity light="type: point; color: #652EA6; intensity: 0.4; distance: 10" position="-2 2 -1"></a-entity>

    <!-- Floor with subtle reflection -->
    <a-plane
      position="0 0 0"
      rotation="-90 0 0"
      width="24" height="24"
      color="#0c0c16"
      metalness="0.4" roughness="0.6"
      shadow></a-plane>

    <!-- Soft grid -->
    <a-entity position="0 0.005 0" rotation="-90 0 0">
      <a-plane width="24" height="24" color="#652EA6" opacity="0.12" material="shader: flat"></a-plane>
    </a-entity>

    <!-- Central title with gentle float -->
    <a-entity position="0 2.3 -5" animation="property: position; to: 0 2.45 -5; loop: true; dir: alternate; dur: 4000; easing: easeInOutSine">
      <a-text
        value="Frame Industries"
        align="center"
        color="#ffffff"
        width="5.5"
        font="https://cdn.aframe.io/fonts/Roboto-msdf.json"
        negate="false">
      </a-text>
      <a-text
        value="Beyond the Frame."
        position="0 -0.45 0"
        align="center"
        color="#42D2D3"
        width="3.8"
        font="https://cdn.aframe.io/fonts/Roboto-msdf.json">
      </a-text>
    </a-entity>

    <!-- Floating interactive panels with hover + grab -->
    <a-entity
      id="panel-about"
      class="grabbable"
      position="-2.4 1.5 -3.8"
      grabbable
      dynamic-body="mass: 0.8"
      animation="property: position; to: -2.4 1.65 -3.8; loop: true; dir: alternate; dur: 3500; easing: easeInOutSine">
      <a-box
        width="1.5" height="0.95" depth="0.05"
        color="#1a1228"
        material="metalness: 0.5; roughness: 0.3; emissive: #2a1848; emissiveIntensity: 0.15"
        class="clickable"
        animation__hover="property: material.emissiveIntensity; to: 0.4; startEvents: mouseenter; dur: 200"
        animation__unhover="property: material.emissiveIntensity; to: 0.15; startEvents: mouseleave; dur: 300">
        <a-text
          value="درباره\nشرکت فناوری دیجیتال"
          position="0 0.12 0.03"
          align="center"
          color="#ffffff"
          width="1.3"
          font="https://cdn.aframe.io/fonts/Roboto-msdf.json">
        </a-text>
      </a-box>
    </a-entity>

    <a-entity
      id="panel-projects"
      class="grabbable"
      position="0 1.5 -3.8"
      grabbable
      dynamic-body="mass: 0.8"
      animation="property: position; to: 0 1.68 -3.8; loop: true; dir: alternate; dur: 4200; easing: easeInOutSine">
      <a-box
        width="1.5" height="0.95" depth="0.05"
        color="#1a1228"
        material="metalness: 0.5; roughness: 0.3; emissive: #183848; emissiveIntensity: 0.15"
        class="clickable"
        animation__hover="property: material.emissiveIntensity; to: 0.45; startEvents: mouseenter; dur: 200"
        animation__unhover="property: material.emissiveIntensity; to: 0.15; startEvents: mouseleave; dur: 300">
        <a-text
          value="پروژه‌ها\nYELO · VR · 3D"
          position="0 0.08 0.03"
          align="center"
          color="#42D2D3"
          width="1.3"
          font="https://cdn.aframe.io/fonts/Roboto-msdf.json">
        </a-text>
      </a-box>
    </a-entity>

    <a-entity
      id="panel-founder"
      class="grabbable"
      position="2.4 1.5 -3.8"
      grabbable
      dynamic-body="mass: 0.8"
      animation="property: position; to: 2.4 1.62 -3.8; loop: true; dir: alternate; dur: 3800; easing: easeInOutSine">
      <a-box
        width="1.5" height="0.95" depth="0.05"
        color="#1a1228"
        material="metalness: 0.5; roughness: 0.3; emissive: #2a1848; emissiveIntensity: 0.15"
        class="clickable"
        animation__hover="property: material.emissiveIntensity; to: 0.4; startEvents: mouseenter; dur: 200"
        animation__unhover="property: material.emissiveIntensity; to: 0.15; startEvents: mouseleave; dur: 300">
        <a-text
          value="بنیان‌گذار\nمحمد حسین مهدوی"
          position="0 0.12 0.03"
          align="center"
          color="#ffffff"
          width="1.3"
          font="https://cdn.aframe.io/fonts/Roboto-msdf.json">
        </a-text>
      </a-box>
    </a-entity>

    <a-entity
      id="panel-contact"
      class="grabbable"
      position="0 0.45 -3.4"
      grabbable
      dynamic-body="mass: 0.8"
      animation="property: position; to: 0 0.58 -3.4; loop: true; dir: alternate; dur: 4500; easing: easeInOutSine">
      <a-box
        width="1.7" height="0.75" depth="0.05"
        color="#122028"
        material="metalness: 0.5; roughness: 0.3; emissive: #183848; emissiveIntensity: 0.2"
        class="clickable"
        animation__hover="property: material.emissiveIntensity; to: 0.5; startEvents: mouseenter; dur: 200"
        animation__unhover="property: material.emissiveIntensity; to: 0.2; startEvents: mouseleave; dur: 300">
        <a-text
          value="تماس\n0936 233 5266"
          position="0 0.04 0.03"
          align="center"
          color="#42D2D3"
          width="1.5"
          font="https://cdn.aframe.io/fonts/Roboto-msdf.json">
        </a-text>
      </a-box>
    </a-entity>

    <!-- Decorative floating glowing cubes -->
    <a-box
      position="-3.8 1.9 -2.2"
      width="0.28" height="0.28" depth="0.28"
      color="#652EA6"
      material="emissive: #652EA6; emissiveIntensity: 0.6"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 9000; easing: linear"
      animation__float="property: position; to: -3.8 2.15 -2.2; loop: true; dir: alternate; dur: 3200; easing: easeInOutSine"
      class="grabbable"
      grabbable
      dynamic-body="mass: 0.4">
    </a-box>
    <a-box
      position="3.8 1.7 -2.6"
      width="0.24" height="0.24" depth="0.24"
      color="#42D2D3"
      material="emissive: #42D2D3; emissiveIntensity: 0.7"
      animation="property: rotation; to: 360 0 180; loop: true; dur: 7000; easing: linear"
      animation__float="property: position; to: 3.8 1.95 -2.6; loop: true; dir: alternate; dur: 2800; easing: easeInOutSine"
      class="grabbable"
      grabbable
      dynamic-body="mass: 0.4">
    </a-box>

    <!-- Small floating light orbs -->
    <a-sphere position="-1.5 2.8 -3" radius="0.08" color="#42D2D3" material="emissive: #42D2D3; emissiveIntensity: 1"
              animation="property: position; to: -1.5 3.05 -3; loop: true; dir: alternate; dur: 2500"></a-sphere>
    <a-sphere position="1.8 2.6 -4" radius="0.06" color="#7c4dff" material="emissive: #7c4dff; emissiveIntensity: 1"
              animation="property: position; to: 1.8 2.85 -4; loop: true; dir: alternate; dur: 3000"></a-sphere>

    <!-- Controllers / Hands -->
    <a-entity id="leftHand" hand-tracking-controls="hand: left; modelColor: #7c4dff"></a-entity>
    <a-entity id="rightHand" hand-tracking-controls="hand: right; modelColor: #42D2D3"></a-entity>
    <a-entity laser-controls="hand: left" raycaster="objects: .clickable, .grabbable"></a-entity>
    <a-entity laser-controls="hand: right" raycaster="objects: .clickable, .grabbable"></a-entity>

    <!-- Camera / Player -->
    <a-entity id="rig" position="0 0 1.8">
      <a-camera
        look-controls
        wasd-controls="acceleration: 25"
        position="0 1.6 0">
      </a-camera>
    </a-entity>

  </a-scene>

  <script>
    const clickSound = document.querySelector('#sfx-click');

    document.addEventListener('click', function (e) {
      const el = e.target.closest('.clickable');
      if (!el) return;

      // Play interaction sound
      if (clickSound && clickSound.components.sound) {
        clickSound.components.sound.playSound();
      }

      // Scale pulse
      const parent = el.parentEl;
      if (parent) {
        parent.setAttribute('animation__pulse', {
          property: 'scale',
          to: '1.06 1.06 1.06',
          dur: 180,
          dir: 'alternate',
          loop: 1
        });
      }
    });
  </script>
</body>
</html>
