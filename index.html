<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0c10">
<title>LumenOS</title>
<style>
  :root {
    --bg: #0a0c10;
    --surface: rgba(255,255,255,0.08);
    --surface-2: rgba(255,255,255,0.12);
    --border: rgba(255,255,255,0.1);
    --text: #f5f7fa;
    --text-2: rgba(245,247,250,0.7);
    --text-3: rgba(245,247,250,0.45);
    --accent: #f5c842;
    --accent-2: #5b8cff;
    --green: #34d399;
    --red: #f87171;
    --radius: 22px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
    background: #000;
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .phone {
    width: 100%;
    height: 100%;
    max-width: 430px;
    max-height: 100dvh;
    position: relative;
    overflow: hidden;
    background: #0a0c10;
  }
  @media (min-width: 480px) {
    body { background: #111; }
    .phone {
      height: min(860px, 96vh);
      border-radius: 36px;
      box-shadow: 0 0 0 10px #1a1a1a, 0 25px 80px rgba(0,0,0,0.6);
    }
  }

  .wallpaper {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 20% 10%, rgba(91,140,255,0.35), transparent 55%),
      radial-gradient(ellipse 70% 45% at 90% 20%, rgba(245,200,66,0.22), transparent 50%),
      radial-gradient(ellipse 60% 40% at 50% 100%, rgba(52,211,153,0.12), transparent 50%),
      linear-gradient(160deg, #0b1020 0%, #0a0c10 45%, #121018 100%);
    z-index: 0;
  }

  .status-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 50;
    padding: calc(10px + var(--safe-top)) 18px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.78rem;
    font-weight: 600;
    pointer-events: none;
  }
  .status-left, .status-right { display: flex; align-items: center; gap: 8px; }
  .status-icons { display: flex; align-items: center; gap: 6px; opacity: 0.9; }
  .battery { display: flex; align-items: center; gap: 4px; }
  .battery-body {
    width: 22px; height: 11px; border: 1.5px solid rgba(255,255,255,0.7);
    border-radius: 3px; padding: 1px; position: relative;
  }
  .battery-body::after {
    content: ''; position: absolute; right: -3px; top: 2px;
    width: 2px; height: 5px; background: rgba(255,255,255,0.7); border-radius: 0 1px 1px 0;
  }
  .battery-level { height: 100%; width: 78%; background: var(--green); border-radius: 1px; }

  .screen {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: none;
    flex-direction: column;
  }
  .screen.active { display: flex; }

  #lock {
    justify-content: space-between;
    padding: calc(70px + var(--safe-top)) 24px calc(40px + var(--safe-bottom));
    z-index: 40;
  }
  .lock-time { text-align: center; }
  .lock-clock {
    font-size: 4.2rem;
    font-weight: 200;
    letter-spacing: -0.04em;
    line-height: 1;
  }
  .lock-date {
    margin-top: 8px;
    font-size: 1.05rem;
    color: var(--text-2);
    font-weight: 500;
  }
  .lock-hint {
    text-align: center;
    color: var(--text-3);
    font-size: 0.85rem;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.9; }
  }
  .lock-swipe {
    width: 40px; height: 4px;
    background: rgba(255,255,255,0.35);
    border-radius: 4px;
    margin: 0 auto 14px;
  }

  #home {
    padding-top: calc(48px + var(--safe-top));
    padding-bottom: calc(88px + var(--safe-bottom));
  }
  .home-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 8px 18px 16px;
    scrollbar-width: none;
  }
  .home-scroll::-webkit-scrollbar { display: none; }

  .search-pill {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 11px 16px;
    margin-bottom: 18px;
    color: var(--text-3);
    font-size: 0.9rem;
  }

  .widget {
    background: linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04));
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 18px;
    margin-bottom: 14px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .widget-row {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 12px;
    margin-bottom: 14px;
  }
  .widget-time .big {
    font-size: 2.4rem;
    font-weight: 300;
    letter-spacing: -0.03em;
  }
  .widget-time .sub {
    color: var(--text-2);
    font-size: 0.85rem;
    margin-top: 4px;
  }
  .widget-weather {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .widget-weather .temp { font-size: 1.8rem; font-weight: 600; }
  .widget-weather .city { color: var(--text-2); font-size: 0.82rem; }
  .widget-music {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .widget-music .cover {
    width: 52px; height: 52px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), #e89a20);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem;
    flex-shrink: 0;
  }
  .widget-music .meta { flex: 1; min-width: 0; }
  .widget-music .title {
    font-weight: 600;
    font-size: 0.92rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .widget-music .artist { color: var(--text-3); font-size: 0.78rem; }
  .widget-music .play {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--surface-2);
    border: none;
    color: var(--text);
    font-size: 0.9rem;
    cursor: pointer;
  }

  .apps-label {
    font-size: 0.78rem;
    color: var(--text-3);
    margin: 6px 4px 10px;
    font-weight: 600;
  }
  .apps-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px 10px;
    margin-bottom: 20px;
  }
  .app {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    border: none;
    background: none;
    color: var(--text);
  }
  .app-icon {
    width: 58px;
    height: 58px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.55rem;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    transition: transform 0.15s ease;
  }
  .app:active .app-icon { transform: scale(0.9); }
  .app-name {
    font-size: 0.7rem;
    color: var(--text-2);
    text-align: center;
    max-width: 70px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .dock {
    position: absolute;
    bottom: calc(14px + var(--safe-bottom));
    left: 16px; right: 16px;
    z-index: 30;
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 12px 10px;
    background: rgba(20, 24, 32, 0.72);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--border);
    border-radius: 28px;
  }
  .dock .app-icon {
    width: 52px; height: 52px;
    border-radius: 14px;
    font-size: 1.35rem;
  }
  .dock .app-name { display: none; }

  #app-window {
    z-index: 35;
    background: #0e1218;
  }
  .app-header {
    padding: calc(14px + var(--safe-top)) 16px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    background: rgba(14,18,24,0.95);
  }
  .app-back {
    border: none;
    background: var(--surface);
    color: var(--text);
    width: 36px; height: 36px;
    border-radius: 10px;
    font-size: 1rem;
    cursor: pointer;
  }
  .app-header h2 {
    font-size: 1.05rem;
    font-weight: 700;
  }
  .app-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px 18px calc(24px + var(--safe-bottom));
  }
  .app-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .app-card h3 {
    font-size: 0.95rem;
    margin-bottom: 6px;
  }
  .app-card p {
    color: var(--text-2);
    font-size: 0.85rem;
    line-height: 1.6;
  }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip {
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(245,200,66,0.12);
    color: var(--accent);
    font-size: 0.75rem;
    font-weight: 600;
    border: 1px solid rgba(245,200,66,0.25);
  }

  #control {
    z-index: 45;
    background: rgba(8,10,14,0.55);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    padding: calc(56px + var(--safe-top)) 18px 24px;
    display: none;
    flex-direction: column;
    gap: 12px;
  }
  #control.open { display: flex; }
  .cc-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .cc-tile {
    background: rgba(255,255,255,0.1);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 16px;
    min-height: 90px;
  }
  .cc-tile.on {
    background: rgba(91,140,255,0.35);
    border-color: rgba(91,140,255,0.5);
  }
  .cc-tile .label {
    font-size: 0.8rem;
    margin-top: 10px;
    font-weight: 600;
  }
  .cc-tile .icon { font-size: 1.3rem; }
  .cc-slider {
    background: rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 16px;
    border: 1px solid var(--border);
  }
  .cc-slider label {
    font-size: 0.8rem;
    color: var(--text-2);
    display: block;
    margin-bottom: 10px;
  }
  .cc-slider input[type=range] {
    width: 100%;
    accent-color: var(--accent);
  }
  .cc-close {
    margin-top: auto;
    align-self: center;
    border: none;
    background: var(--surface-2);
    color: var(--text);
    padding: 10px 24px;
    border-radius: 999px;
    font-size: 0.85rem;
    cursor: pointer;
  }

  .home-indicator {
    position: absolute;
    bottom: calc(6px + var(--safe-bottom));
    left: 50%;
    transform: translateX(-50%);
    width: 110px;
    height: 4px;
    background: rgba(255,255,255,0.35);
    border-radius: 4px;
    z-index: 60;
  }

  .pull-zone {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: calc(28px + var(--safe-top));
    z-index: 55;
  }

  .brand {
    text-align: center;
    font-size: 0.7rem;
    color: var(--text-3);
    margin-top: 8px;
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="wallpaper"></div>

  <div class="status-bar" id="statusBar">
    <div class="status-left"><span id="statusTime">12:00</span></div>
    <div class="status-right">
      <div class="status-icons">
        <span>▮▮▮</span>
        <span>Wi‑Fi</span>
      </div>
      <div class="battery">
        <span id="batText">78%</span>
        <div class="battery-body"><div class="battery-level"></div></div>
      </div>
    </div>
  </div>

  <div class="pull-zone" id="pullZone"></div>

  <section class="screen active" id="lock">
    <div class="lock-time">
      <div class="lock-clock" id="lockClock">12:00</div>
      <div class="lock-date" id="lockDate">دوشنبه ۱۸ مرداد</div>
    </div>
    <div>
      <div class="lock-swipe"></div>
      <div class="lock-hint">برای باز کردن به بالا بکشید</div>
      <div class="brand">LUMENOS · LTC</div>
    </div>
  </section>

  <section class="screen" id="home">
    <div class="home-scroll">
      <div class="search-pill">🔍 جستجو در LumenOS</div>

      <div class="widget-row">
        <div class="widget widget-time">
          <div class="big" id="homeClock">12:00</div>
          <div class="sub" id="homeDate">دوشنبه · ۱۸ مرداد</div>
        </div>
        <div class="widget widget-weather">
          <div class="temp">۲۸°</div>
          <div class="city">تهران · آفتابی</div>
        </div>
      </div>

      <div class="widget widget-music">
        <div class="cover">♪</div>
        <div class="meta">
          <div class="title">YELO Player</div>
          <div class="artist">پخش موسیقی LTC</div>
        </div>
        <button class="play" type="button" id="musicBtn">▶</button>
      </div>

      <div class="apps-label">برنامه‌ها</div>
      <div class="apps-grid" id="appsGrid"></div>
    </div>

    <nav class="dock" id="dock"></nav>
  </section>

  <section class="screen" id="app-window">
    <div class="app-header">
      <button class="app-back" id="appBack" type="button">←</button>
      <h2 id="appTitle">برنامه</h2>
    </div>
    <div class="app-body" id="appBody"></div>
  </section>

  <section id="control">
    <div class="cc-grid">
      <div class="cc-tile on" data-toggle>
        <div class="icon">📡</div>
        <div class="label">وای‌فای</div>
      </div>
      <div class="cc-tile on" data-toggle>
        <div class="icon">📶</div>
        <div class="label">داده موبایل</div>
      </div>
      <div class="cc-tile" data-toggle>
        <div class="icon">💡</div>
        <div class="label">چراغ‌قوه</div>
      </div>
      <div class="cc-tile" data-toggle>
        <div class="icon">✈️</div>
        <div class="label">حالت هواپیما</div>
      </div>
    </div>
    <div class="cc-slider">
      <label>روشنایی</label>
      <input type="range" min="20" max="100" value="70" id="brightness">
    </div>
    <div class="cc-slider">
      <label>صدا</label>
      <input type="range" min="0" max="100" value="55">
    </div>
    <button class="cc-close" id="ccClose" type="button">بستن</button>
  </section>

  <div class="home-indicator" id="homeIndicator"></div>
</div>

<script>
(function () {
  const apps = [
    { id: 'phone', name: 'تلفن', icon: '📞', color: 'linear-gradient(135deg,#34d399,#059669)', dock: true },
    { id: 'messages', name: 'پیام', icon: '💬', color: 'linear-gradient(135deg,#5b8cff,#2563eb)', dock: true },
    { id: 'browser', name: 'مرورگر', icon: '🌐', color: 'linear-gradient(135deg,#60a5fa,#1d4ed8)', dock: true },
    { id: 'settings', name: 'تنظیمات', icon: '⚙️', color: 'linear-gradient(135deg,#94a3b8,#475569)', dock: true },
    { id: 'yelo', name: 'YELO', icon: '🎵', color: 'linear-gradient(135deg,#f5c842,#d97706)' },
    { id: 'shop', name: 'فروشگاه', icon: '🛒', color: 'linear-gradient(135deg,#a78bfa,#7c3aed)' },
    { id: 'camera', name: 'دوربین', icon: '📷', color: 'linear-gradient(135deg,#64748b,#1e293b)' },
    { id: 'gallery', name: 'گالری', icon: '🖼️', color: 'linear-gradient(135deg,#f472b6,#db2777)' },
    { id: 'files', name: 'فایل‌ها', icon: '📁', color: 'linear-gradient(135deg,#fbbf24,#b45309)' },
    { id: 'notes', name: 'یادداشت', icon: '📝', color: 'linear-gradient(135deg,#fde68a,#ca8a04)' },
    { id: 'map', name: 'نقشه', icon: '🗺️', color: 'linear-gradient(135deg,#4ade80,#16a34a)' },
    { id: 'calc', name: 'ماشین‌حساب', icon: '🔢', color: 'linear-gradient(135deg,#e2e8f0,#64748b)' }
  ];

  const appContent = {
    phone: { title: 'تلفن', html: '<div class="app-card"><h3>شماره‌گیر LumenOS</h3><p>رابط تماس ترکیبی از سادگی iOS و دسترسی سریع Android.</p><div class="chip-row"><span class="chip">تماس اخیر</span><span class="chip">مخاطبین</span><span class="chip">صفحه‌کلید</span></div></div>' },
    messages: { title: 'پیام‌ها', html: '<div class="app-card"><h3>مرکز پیام</h3><p>پیام‌رسانی یکپارچه با اعلان‌های هوشمند و اولویت‌بندی مکالمات.</p></div><div class="app-card"><h3>LTC Support</h3><p>سلام! سفارش شما ثبت شد.</p></div>' },
    browser: { title: 'مرورگر', html: '<div class="app-card"><h3>Lumen Browser</h3><p>موتور سریع، حالت تاریک پیش‌فرض، و حریم خصوصی بالاتر.</p><div class="chip-row"><span class="chip">https://ltc</span><span class="chip">نشانک‌ها</span></div></div>' },
    settings: { title: 'تنظیمات', html: '<div class="app-card"><h3>سیستم</h3><p>نمایش · صدا · شبکه · حریم خصوصی · درباره LumenOS</p></div><div class="app-card"><h3>نسخه</h3><p>LumenOS Preview 1.0 · LTC</p></div>' },
    yelo: { title: 'YELO Music', html: '<div class="app-card"><h3>پخش‌کننده موسیقی</h3><p>همان تجربه YELO با تم سیستم و کنترل‌های یکپارچه.</p><div class="chip-row"><span class="chip">صفحه اصلی</span><span class="chip">علاقه‌مندی</span><span class="chip">Display Mode</span></div></div>' },
    shop: { title: 'فروشگاه LTC', html: '<div class="app-card"><h3>خدمات دیجیتال</h3><p>ادیت · پاورپوینت · ورد · اکسل — سفارش مستقیم از سیستم‌عامل.</p></div>' },
    camera: { title: 'دوربین', html: '<div class="app-card"><h3>دوربین هوشمند</h3><p>حالت پرتره، شب، و ویدیو — الهام از بهترین تجربه‌های موبایل.</p></div>' },
    gallery: { title: 'گالری', html: '<div class="app-card"><h3>آلبوم‌ها</h3><p>مرتب‌سازی خودکار، جستجوی هوشمند، و اشتراک سریع.</p></div>' },
    files: { title: 'فایل‌ها', html: '<div class="app-card"><h3>مدیریت فایل</h3><p>نمای درختی ویندوزی + دسترسی سریع اندرویدی.</p></div>' },
    notes: { title: 'یادداشت', html: '<div class="app-card"><h3>یادداشت سریع</h3><p>برای ایده، لیست کارها و یادآوری‌های روزانه.</p></div>' },
    map: { title: 'نقشه', html: '<div class="app-card"><h3>نقشه و مسیر</h3><p>مسیریابی، مکان‌های ذخیره‌شده و ترافیک زنده.</p></div>' },
    calc: { title: 'ماشین‌حساب', html: '<div class="app-card"><h3>ماشین‌حساب</h3><p>پایه و علمی — همیشه در دسترس از داک یا صفحه اصلی.</p></div>' }
  };

  const lock = document.getElementById('lock');
  const home = document.getElementById('home');
  const appWindow = document.getElementById('app-window');
  const control = document.getElementById('control');
  const appsGrid = document.getElementById('appsGrid');
  const dock = document.getElementById('dock');

  function makeAppButton(app) {
    const btn = document.createElement('button');
    btn.className = 'app';
    btn.type = 'button';
    btn.innerHTML = '<div class="app-icon" style="background:' + app.color + '">' + app.icon + '</div><span class="app-name">' + app.name + '</span>';
    btn.addEventListener('click', function () { openApp(app.id); });
    return btn;
  }

  apps.forEach(function (app) {
    if (!app.dock) appsGrid.appendChild(makeAppButton(app));
  });
  apps.filter(function (a) { return a.dock; }).forEach(function (app) {
    dock.appendChild(makeAppButton(app));
  });

  function showScreen(el) {
    document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
    el.classList.add('active');
  }

  function unlock() {
    showScreen(home);
  }

  function openApp(id) {
    const data = appContent[id] || { title: 'برنامه', html: '<div class="app-card"><p>این یک پیش‌نمایش رابط است.</p></div>' };
    document.getElementById('appTitle').textContent = data.title;
    document.getElementById('appBody').innerHTML = data.html;
    showScreen(appWindow);
  }

  document.getElementById('appBack').addEventListener('click', function () {
    showScreen(home);
  });

  let startY = null;
  lock.addEventListener('touchstart', function (e) {
    startY = e.touches[0].clientY;
  }, { passive: true });
  lock.addEventListener('touchend', function (e) {
    if (startY === null) return;
    const dy = startY - e.changedTouches[0].clientY;
    if (dy > 40) unlock();
    startY = null;
  });
  lock.addEventListener('click', unlock);

  document.getElementById('homeIndicator').addEventListener('click', function () {
    control.classList.remove('open');
    showScreen(home);
  });

  document.getElementById('pullZone').addEventListener('click', function () {
    control.classList.add('open');
  });
  document.getElementById('ccClose').addEventListener('click', function () {
    control.classList.remove('open');
  });
  document.querySelectorAll('[data-toggle]').forEach(function (tile) {
    tile.addEventListener('click', function () {
      tile.classList.toggle('on');
    });
  });
  document.getElementById('brightness').addEventListener('input', function (e) {
    document.querySelector('.wallpaper').style.filter = 'brightness(' + (e.target.value / 100) + ')';
  });

  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const t = h + ':' + m;
    document.getElementById('statusTime').textContent = t;
    document.getElementById('lockClock').textContent = t;
    document.getElementById('homeClock').textContent = t;
    const days = ['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
    const months = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
    const dayName = days[now.getDay()];
    const dateText = dayName + ' · ' + now.getDate() + ' ' + months[Math.min(now.getMonth(), 11)];
    document.getElementById('lockDate').textContent = dateText;
    document.getElementById('homeDate').textContent = dateText;
  }
  updateClock();
  setInterval(updateClock, 15000);

  document.getElementById('musicBtn').addEventListener('click', function () {
    openApp('yelo');
  });
})();
</script>
</body>
</html>
