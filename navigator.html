<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0e14">
<meta name="description" content="شبیه‌ساز Meta Navigator برای هدست‌های Quest و حالت بصری Orion.">
<meta name="author" content="Lumen Technologies Co.">
<title>LumenOS · Meta Navigator</title>
<style>
:root{--glass:rgba(255,255,255,.08);--line:rgba(255,255,255,.14);--text:#f5f7fb;--muted:rgba(245,247,251,.62);--accent:#7eb6ff;--gold:#f5c842}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Tahoma,sans-serif;user-select:none}
body{background:#05070b}
.stage{position:relative;width:100%;height:100%;overflow:hidden}
.world{position:absolute;inset:0;background:radial-gradient(ellipse 80% 50% at 50% 18%,rgba(90,140,220,.28),transparent 58%),linear-gradient(180deg,#1a2740 0%,#0b1220 46%,#07090d 100%);transition:filter .25s}
.world.orion{background:linear-gradient(180deg,rgba(8,16,28,.28),rgba(8,16,28,.55)),linear-gradient(180deg,#6ea0c8 0%,#c9b48a 42%,#7a8b6a 100%)}
.world.dim{filter:brightness(.42) saturate(.85)}
.hint{position:absolute;top:18px;left:50%;transform:translateX(-50%);z-index:5;font-size:12px;color:var(--muted);background:rgba(0,0,0,.28);padding:6px 12px;border-radius:999px;border:1px solid var(--line)}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:18px 16px calc(118px + env(safe-area-inset-bottom,0px));opacity:0;pointer-events:none;transition:opacity .28s ease}
.overlay.on{opacity:1;pointer-events:auto}
.panel{width:min(920px,100%);height:min(560px,68vh);border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.2);box-shadow:0 30px 80px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.28);backdrop-filter:blur(28px) saturate(140%);-webkit-backdrop-filter:blur(28px) saturate(140%);display:flex;flex-direction:column;overflow:hidden}
.panel.orion-skin{background:linear-gradient(160deg,rgba(220,235,255,.22),rgba(255,255,255,.08) 45%,rgba(200,230,210,.12))}
.head{display:flex;align-items:center;gap:12px;padding:16px 18px 10px}
.head h1{font-size:18px;font-weight:700}
.head p{font-size:12px;color:var(--muted)}
.search{margin:0 18px 12px;background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:14px;padding:9px 12px;color:var(--muted);font-size:14px}
.scroll{flex:1;overflow:auto;padding:4px 16px 18px;scrollbar-width:none}
.apps{display:grid;grid-template-columns:repeat(6,1fr);gap:16px 10px}
@media(max-width:720px){.apps{grid-template-columns:repeat(4,1fr)}}
.app{border:0;background:none;color:inherit;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer}
.app:nth-child(even){transform:translateY(10px)}
.jewel{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:26px;box-shadow:0 10px 24px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.4)}
.app span{font-size:11px;color:var(--muted);max-width:72px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.card h3{font-size:14px;margin-bottom:4px}
.card p,.card small{font-size:12px;color:var(--muted);line-height:1.6}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.avatar{height:86px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.sw{width:42px;height:24px;border-radius:999px;background:rgba(255,255,255,.18);position:relative;cursor:pointer}
.sw.on{background:#3b82f6}
.sw i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on i{left:21px}
input[type=range]{width:100%;accent-color:#7eb6ff}
.bar{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:28px;background:rgba(16,20,28,.62);border:1px solid rgba(255,255,255,.16);box-shadow:0 16px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.18);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.tab,.meta{width:44px;height:44px;border:0;border-radius:16px;background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer}
.tab.on{background:rgba(255,255,255,.16)}
.tab svg,.meta svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.meta{background:linear-gradient(160deg,#5b8cff,#1b3dff)}
.clock{min-width:64px;text-align:center;font-size:12px;font-weight:650;padding:0 6px;color:var(--muted)}
.toast{position:absolute;top:56px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.45);border:1px solid var(--line);padding:8px 14px;border-radius:12px;font-size:13px;opacity:0;transition:opacity .2s;z-index:30}
.toast.show{opacity:1}
.win{position:absolute;width:min(320px,70vw);border-radius:18px;padding:14px;background:rgba(255,255,255,.1);border:1px solid var(--line);backdrop-filter:blur(18px)}
.hidden-wins .win{display:none}
.mode{position:absolute;top:16px;right:16px;z-index:8;display:flex;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.mode button{border:0;background:rgba(0,0,0,.28);color:var(--muted);padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer}
.mode button.on{background:rgba(126,182,255,.22);color:#fff}
a.back{position:absolute;top:16px;left:16px;z-index:8;color:#fff;text-decoration:none;font-size:12px;background:rgba(0,0,0,.28);border:1px solid var(--line);padding:6px 10px;border-radius:999px}
</style>
</head>
<body>
<div class="stage">
  <div class="world" id="world"></div>
  <a class="back" href="./index.html">LumenOS</a>
  <div class="mode"><button type="button" id="mQuest" class="on">Quest</button><button type="button" id="mOrion">Orion</button></div>
  <div class="hint" id="hint">دکمه Meta را بزنید · Navigator</div>
  <div class="toast" id="toast"></div>
  <div class="win" style="top:22%;left:8%"><h4>YELO Music</h4><p style="font-size:12px;color:var(--muted)">پنجره شناور LTC</p></div>
  <div class="win" style="top:38%;right:10%"><h4>مرورگر</h4><p style="font-size:12px;color:var(--muted)">lt-c.iddns.ir</p></div>
  <div class="overlay on" id="overlay">
    <section class="panel" id="panel">
      <div class="head"><div><h1 id="title">کتابخانه</h1><p id="sub">Horizon OS Navigator · LTC</p></div></div>
      <div class="search" id="searchBox">⌕  جستجوی برنامه و افراد</div>
      <div class="scroll" id="body"></div>
    </section>
  </div>
  <nav class="bar" id="bar">
    <button class="meta" id="metaBtn" type="button"><svg viewBox="0 0 24 24"><path d="M7 15c2.2-4 3.3-7 5-7s2.8 3 5 7c-1.2 2-2.5 3-5 3s-3.8-1-5-3z"/></svg></button>
    <button class="tab" data-tab="you" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5 19c1.4-3 3.8-4.5 7-4.5S17.6 16 19 19"/></svg></button>
    <button class="tab" data-tab="notes" type="button"><svg viewBox="0 0 24 24"><path d="M6 16V10a6 6 0 0 1 12 0v6"/><path d="M5 16h14"/><path d="M10 19h4"/></svg></button>
    <button class="tab" data-tab="people" type="button"><svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="2.6"/><circle cx="16" cy="10" r="2.1"/><path d="M4.5 18c1-2.4 2.8-3.6 4.6-3.6 1.5 0 2.8.7 3.7 1.8"/><path d="M14 15.2c1.5 0 3 .8 4 2.8"/></svg></button>
    <button class="tab on" data-tab="apps" type="button"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.4"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.4"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.4"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.4"/></svg></button>
    <button class="tab" data-tab="controls" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 4v2M12 18v2M4 12h2M18 12h2M6.4 6.4l1.4 1.4M16.2 16.2l1.4 1.4M17.6 6.4l-1.4 1.4M7.8 16.2l-1.4 1.4"/></svg></button>
    <button class="tab" data-tab="windows" type="button"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="12" height="10" rx="1.5"/><rect x="8" y="9" width="12" height="10" rx="1.5"/></svg></button>
    <button class="tab" data-tab="home" type="button"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5"/><path d="M7 10.5V19h10v-8.5"/></svg></button>
    <div class="clock" id="clock">09:41<br>78%</div>
  </nav>
</div>
<script>
(function(){
  var tab='apps', overlayOn=true, orion=false, winsHidden=false;
  var wifi=true,bt=true,rec=false,travel=false,bright=80,vol=55;
  var apps=[{n:'YELO',i:'\u266a',c:'linear-gradient(145deg,#f5c842,#c47a10)'},{n:'\u0641\u0631\u0648\u0634\u06af\u0627\u0647',i:'\u25c8',c:'linear-gradient(145deg,#bf5af2,#6d28d9)'},{n:'\u0645\u0631\u0648\u0631\u06af\u0631',i:'\u25ce',c:'linear-gradient(145deg,#64d2ff,#0a84ff)'},{n:'\u062f\u0648\u0631\u0628\u06cc\u0646',i:'\u25c9',c:'linear-gradient(145deg,#94a3b8,#334155)'},{n:'\u062a\u0646\u0638\u06cc\u0645\u0627\u062a',i:'\u2699',c:'linear-gradient(145deg,#cbd5e1,#64748b)'},{n:'\u0646\u0642\u0634\u0647',i:'\u25a3',c:'linear-gradient(145deg,#34d399,#0ea5e9)'},{n:'\u0641\u0627\u06cc\u0644',i:'\u25a4',c:'linear-gradient(145deg,#fbbf24,#ea580c)'},{n:'\u06cc\u0627\u062f\u062f\u0627\u0634\u062a',i:'\u270e',c:'linear-gradient(145deg,#facc15,#f59e0b)'},{n:'\u06af\u0627\u0644\u0631\u06cc',i:'\u25a6',c:'linear-gradient(145deg,#fb7185,#e11d48)'},{n:'VR Home',i:'\u2302',c:'linear-gradient(145deg,#818cf8,#4f46e5)'},{n:'LTC Hub',i:'\u2726',c:'linear-gradient(145deg,#f5c842,#1d4ed8)'},{n:'Quest Helper',i:'\u25d0',c:'linear-gradient(145deg,#38bdf8,#1e3a8a)'}];
  var people=[{n:'Ali',c:'#3b82f6'},{n:'Sara',c:'#22c55e'},{n:'Nima',c:'#f59e0b'},{n:'LTC',c:'#f5c842'},{n:'Reza',c:'#8b5cf6'},{n:'Maryam',c:'#06b6d4'}];
  var titles={you:'\u0634\u0645\u0627',notes:'\u0627\u0639\u0644\u0627\u0646\u200c\u0647\u0627',people:'\u0627\u0641\u0631\u0627\u062f',apps:'\u06a9\u062a\u0627\u0628\u062e\u0627\u0646\u0647',controls:'\u06a9\u0646\u062a\u0631\u0644 \u0633\u0631\u06cc\u0639',windows:'\u067e\u0646\u062c\u0631\u0647\u200c\u0647\u0627',home:'\u062e\u0627\u0646\u0647 / \u0639\u0628\u0648\u0631 \u062a\u0635\u0648\u06cc\u0631'};
  function toast(t){var el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(function(){el.classList.remove('show')},1400)}
  function row(label,key){var on={wifi:wifi,bt:bt,rec:rec,travel:travel}[key];return '<div class="toggle"><span>'+label+'</span><div class="sw '+(on?'on':'')+'" data-k="'+key+'"><i></i></div></div>';}
  function bindSw(){document.querySelectorAll('.sw').forEach(function(sw){sw.onclick=function(){var k=sw.dataset.k;if(k==='wifi')wifi=!wifi;if(k==='bt')bt=!bt;if(k==='rec')rec=!rec;if(k==='travel')travel=!travel;sw.classList.toggle('on');};});}
  function render(){
    document.getElementById('title').textContent=titles[tab];
    document.getElementById('sub').textContent=orion?'Orion Aero UI \u00b7 LTC':'Horizon OS Navigator \u00b7 LTC';
    document.getElementById('panel').classList.toggle('orion-skin',orion);
    document.getElementById('world').classList.toggle('orion',orion);
    document.getElementById('world').classList.toggle('dim',overlayOn);
    document.getElementById('overlay').classList.toggle('on',overlayOn);
    document.getElementById('mQuest').classList.toggle('on',!orion);
    document.getElementById('mOrion').classList.toggle('on',orion);
    document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('on',b.dataset.tab===tab)});
    var box=document.getElementById('body');
    if(tab==='apps'){box.innerHTML='<div class="apps">'+apps.map(function(a){return '<button class="app" type="button"><div class="jewel" style="background:'+a.c+'">'+a.i+'</div><span>'+a.n+'</span></button>';}).join('')+'</div>';box.querySelectorAll('.app').forEach(function(b,i){b.onclick=function(){toast(apps[i].n)}});}
    else if(tab==='you'){box.innerHTML='<div class="card"><h3>Lumen Profile</h3><p>\u0645\u062d\u0645\u062f\u062d\u0633\u06cc\u0646 \u0645\u0647\u062f\u0648\u06cc \u00b7 LTC</p><small>\u0648\u0636\u0639\u06cc\u062a: \u0622\u0646\u0644\u0627\u06cc\u0646</small></div><div class="card"><h3>Avatar</h3><p>\u0648\u06cc\u0631\u0627\u06cc\u0634 \u0686\u0647\u0631\u0647 \u0648 \u0644\u0628\u0627\u0633 \u0628\u0631\u0627\u06cc \u062e\u0627\u0646\u0647 VR.</p></div>';}
    else if(tab==='notes'){box.innerHTML='<div class="card"><h3>\u0633\u06cc\u0633\u062a\u0645</h3><p>Navigator \u0631\u0648\u06cc \u0647\u062f\u0633\u062a\u200c\u0647\u0627\u06cc Quest \u0641\u0639\u0627\u0644 \u0634\u062f.</p></div><div class="card"><h3>YELO</h3><p>\u067e\u0644\u06cc\u200c\u0644\u06cc\u0633\u062a \u062c\u062f\u06cc\u062f \u0622\u0645\u0627\u062f\u0647 \u0627\u0633\u062a.</p></div>';}
    else if(tab==='people'){box.innerHTML='<div class="people">'+people.map(function(p){return '<div class="avatar"><div class="dot" style="background:'+p.c+'">'+p.n[0]+'</div><small>'+p.n+'</small></div>';}).join('')+'</div>';}
    else if(tab==='controls'){box.innerHTML='<div class="card">'+row('\u0648\u0627\u06cc\u200c\u0641\u0627\u06cc','wifi')+row('\u0628\u0644\u0648\u062a\u0648\u062b','bt')+row('\u0636\u0628\u0637 \u0635\u0641\u062d\u0647','rec')+row('\u062d\u0627\u0644\u062a \u0633\u0641\u0631','travel')+'<div class="toggle"><span>\u0631\u0648\u0634\u0646\u0627\u06cc\u06cc</span></div><input id="br" type="range" min="30" max="100" value="'+bright+'"><div class="toggle"><span>\u0635\u062f\u0627</span></div><input id="vol" type="range" min="0" max="100" value="'+vol+'"></div>';bindSw();document.getElementById('br').oninput=function(e){bright=+e.target.value;document.getElementById('world').style.filter='brightness('+(overlayOn?bright/180:bright/100)+')'};document.getElementById('vol').oninput=function(e){vol=+e.target.value};}
    else if(tab==='windows'){winsHidden=!winsHidden;document.body.classList.toggle('hidden-wins',winsHidden);box.innerHTML='<div class="card"><h3>'+(winsHidden?'\u067e\u0646\u062c\u0631\u0647\u200c\u0647\u0627 \u067e\u0646\u0647\u0627\u0646 \u0634\u062f\u0646\u062f':'\u067e\u0646\u062c\u0631\u0647\u200c\u0647\u0627 \u0646\u0645\u0627\u06cc\u0627\u0646 \u0647\u0633\u062a\u0646\u062f')+'</h3><p>\u0646\u0645\u0627\u06cc\u0634 \u06cc\u0627 \u067e\u0646\u0647\u0627\u0646 \u06a9\u0631\u062f\u0646 \u067e\u0646\u062c\u0631\u0647\u200c\u0647\u0627\u06cc \u06f2\u0628\u0639\u062f\u06cc.</p></div>';}
    else if(tab==='home'){overlayOn=false;document.getElementById('overlay').classList.remove('on');document.getElementById('world').classList.remove('dim');toast(orion?'Passthrough Orion':'VR Home');box.innerHTML='<div class="card"><h3>\u062e\u0627\u0646\u0647</h3><p>\u0628\u0631\u0627\u06cc \u0628\u0627\u0632\u06af\u0634\u062a \u062f\u0648\u0628\u0627\u0631\u0647 Meta \u0631\u0627 \u0628\u0632\u0646\u06cc\u062f.</p></div>';}
  }
  document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){tab=b.dataset.tab;overlayOn=true;render();};});
  document.getElementById('metaBtn').onclick=function(){overlayOn=!overlayOn;if(overlayOn&&tab==='home')tab='apps';render();};
  document.getElementById('mQuest').onclick=function(){orion=false;render()};
  document.getElementById('mOrion').onclick=function(){orion=true;render()};
  document.addEventListener('keydown',function(e){if(e.key==='m'||e.key==='M')document.getElementById('metaBtn').click()});
  function tick(){var n=new Date();document.getElementById('clock').innerHTML=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')+'<br>78%';}
  tick();setInterval(tick,20000);render();
})();
</script>
</body>
</html>
